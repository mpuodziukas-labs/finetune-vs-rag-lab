name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # why: attach evidence and SBOM to the release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --group dev --frozen
      - name: Same steps as local
        env:
          DEWATERMARK_OPTIONAL: "1"
        run: bash scripts/ci-local.sh
      - name: Attach evidence and SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" EVIDENCE.md SBOM.cdx.json --title "$GITHUB_REF_NAME" --generate-notes
