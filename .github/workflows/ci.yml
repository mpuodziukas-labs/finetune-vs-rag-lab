name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint-test-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --group dev --frozen
      - name: Same steps as local (lock check, ruff, mypy, pytest, selftest, evidence)
        env:
          DEWATERMARK_OPTIONAL: "1"
        run: bash scripts/ci-local.sh
  # Full `make verify` additionally needs receipts/ from `make run` (about 11 minutes on CPU),
  # so it is run locally and its output is the receipt of record (demo/verify.transcript.txt).
