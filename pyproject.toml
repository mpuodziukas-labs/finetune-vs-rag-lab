[project]
name = "ftlab"
version = "0.1.0"
description = "Fine-tune (LoRA) vs retrieval few-shot vs zero-shot, measured head to head on CPU."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.3,<3",
  "transformers>=4.44,<6",
  "peft>=0.12,<1",
  "huggingface_hub>=0.24,<2",
  "pyarrow>=15",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5", "types-PyYAML"]

[project.scripts]
ftlab = "ftlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ftlab"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is a formatting nit; not gated

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/ftlab"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.uv]
exclude-newer = "2026-10-31T00:00:00Z"
